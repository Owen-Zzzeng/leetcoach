<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LeetCode Coach</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app__header">
      <div class="app__brand">
        <span class="app__dot"></span>
        <span class="app__title">Coach</span>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tabs__btn is-active" data-tab="chat" type="button">Chat</button>
        <button class="tabs__btn" data-tab="calendar" type="button">Calendar</button>
        <button class="tabs__btn" data-tab="roadmap" type="button">Roadmap</button>
      </nav>
      <button class="app__logout" id="logoutBtn" type="button">Log out</button>
    </header>

    <main class="chat" id="chat"></main>

    <section class="calendar" id="calendarView" hidden>
      <div class="calendar__nav">
        <button class="calendar__navbtn" id="prevMonth" type="button" aria-label="Previous month">‹</button>
        <span class="calendar__label" id="monthLabel"></span>
        <button class="calendar__navbtn" id="nextMonth" type="button" aria-label="Next month">›</button>
      </div>
      <div class="calendar__weekdays">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
      <div class="calendar__grid" id="calendarGrid"></div>
      <div class="calendar__legend">
        <span><i class="legend-dot legend-dot--green"></i>solved independently / easy review</span>
        <span><i class="legend-dot legend-dot--yellow"></i>used a hint / struggled</span>
        <span><i class="legend-dot legend-dot--red"></i>viewed solution / gave up</span>
      </div>
    </section>

    <section class="roadmap" id="roadmapView" hidden>
      <div class="roadmap__crumb" id="roadmapCrumb"></div>
      <div class="roadmap__topics" id="roadmapTopics"></div>
      <div class="roadmap__table-wrap" id="roadmapTableWrap" hidden>
        <table class="roadmap__table">
          <thead>
            <tr>
              <th class="col-status">Status</th>
              <th class="col-star">Star</th>
              <th class="col-title sortable" data-sort="title">Problem</th>
              <th class="col-diff sortable" data-sort="difficulty">Difficulty</th>
            </tr>
          </thead>
          <tbody id="roadmapTableBody"></tbody>
        </table>
      </div>
    </section>

    <form class="composer" id="composer">
      <textarea
        id="input"
        class="composer__input"
        placeholder="Message Coach…"
        rows="1"
        autofocus
      ></textarea>
      <button class="composer__send" id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
          <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
