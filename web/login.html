<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LeetCode Coach</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth">
    <div class="auth__card">
      <div class="auth__brand">
        <span class="app__dot"></span>
        <span class="app__title">Coach</span>
      </div>

      <h1 class="auth__heading" id="authHeading">Welcome back</h1>
      <p class="auth__sub" id="authSub">Log in to pick up where you left off.</p>

      <form class="auth__form" id="authForm">
        <label class="auth__label">
          Email
          <input class="auth__input" id="email" type="email" autocomplete="email" required />
        </label>
        <label class="auth__label">
          Password
          <input class="auth__input" id="password" type="password" autocomplete="current-password" required />
        </label>
        <div class="auth__error" id="authError" hidden></div>
        <button class="auth__submit" id="authSubmit" type="submit">Log in</button>
      </form>

      <p class="auth__toggle">
        <span id="toggleText">Don't have an account?</span>
        <button class="auth__link" id="toggleBtn" type="button">Register</button>
      </p>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
